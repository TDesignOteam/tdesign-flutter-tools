name: Build Multi-Platform Binaries

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-binaries-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-macos-intel:
    uses: ./.github/workflows/build-reusable.yml
    with:
      runner: macos-latest
      artifact-name: api_tool_macos_intel
      binary-name: api_tool_macos_intel

  build-macos-arm64:
    uses: ./.github/workflows/build-reusable.yml
    with:
      runner: macos-latest
      artifact-name: api_tool_macos_arm64
      binary-name: api_tool_macos_arm64
      compile-args: '--target-os=macos --target-arch=arm64'

  build-linux-x64:
    uses: ./.github/workflows/build-reusable.yml
    with:
      runner: ubuntu-latest
      artifact-name: api_tool_linux
      binary-name: api_tool_linux
      compile-args: '--target-arch=x64'

  build-windows-x64:
    uses: ./.github/workflows/build-reusable.yml
    with:
      runner: windows-latest
      artifact-name: api_tool_windows
      binary-name: api_tool_windows.exe

  comment-on-pr:
    name: 更新二进制产物 PR 评论
    needs: [build-macos-intel, build-macos-arm64, build-linux-x64, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: 组装产物下载链接
        id: binary-comment
        env:
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          base="https://github.com/${GH_REPO}/actions/runs/${RUN_ID}"
          {
            echo 'body<<EOF'
            echo "✅ 编译完成，产物如下："
            echo "- [api_tool_macos_intel](${base}/artifacts)（job: build-macos-intel）"
            echo "- [api_tool_macos_arm64](${base}/artifacts)（job: build-macos-arm64）"
            echo "- [api_tool_linux](${base}/artifacts)（job: build-linux-x64）"
            echo "- [api_tool_windows](${base}/artifacts)（job: build-windows-x64）"
            echo ""
            echo "<!-- AUTO_BINARY_BUILD_HOOK -->"
            echo ""
            echo "_在 Actions 运行页 Artifacts 区域按平台名称下载。_"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 更新 PR 评论
        uses: TDesignOteam/workflows/actions/maintain-one-comment@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.binary-comment.outputs.body }}
          number: ${{ github.event.pull_request.number }}
          body-include: "<!-- AUTO_BINARY_BUILD_HOOK -->"
